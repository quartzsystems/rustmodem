[workspace]
resolver = "3"
members = [
    # Modem: the engine trait every softmodem implements, and the null engine.
    "modem/engine",
    # DTE: what the host sees on the COM port.
    "dte/at",
    "dte/serial",
    # VoIP: the telephone side.
    "voip/sdp",
    "voip/rtp",
    "voip/sip",
    # Service: the pool, its configuration, its messages and its control API.
    "service/msg",
    "service/config",
    "service/ctlproto",
    "service/ctlsrv",
    "service/pipe",
    "service/pool",
    "service/svc",
    # UI: the manager.
    "ui/model",
    "ui/glyph",
    "ui/win32",
    "ui/manager",
    # Tools: the command-line client and the demo service.
    "tools/ctl",
    "tools/demosvc",
]
# The fuzz targets build with cargo-fuzz on a nightly toolchain and keep
# their own lockfile.
exclude = ["tools/fuzz"]

[workspace.package]
# Kept equal to the VERSION file; ci/version.sh checks it.
version = "0.0.2"
edition = "2024"
license = "MIT"
authors = ["Quartz Systems"]
publish = false

[workspace.dependencies]
# Third-party crates.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = "0.25.21"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
windows = "0.62.2"
windows-service = "0.8.1"
# For the screenshot tests of the manager, which read their goldens.
png = "0.18.1"

# The workspace's own crates.
engine = { path = "modem/engine" }
at = { path = "dte/at" }
serial = { path = "dte/serial" }
msg = { path = "service/msg" }
config = { path = "service/config" }
ctlproto = { path = "service/ctlproto" }
ctlsrv = { path = "service/ctlsrv" }
pipe = { path = "service/pipe" }
pool = { path = "service/pool" }
model = { path = "ui/model" }
glyph = { path = "ui/glyph" }
win32 = { path = "ui/win32" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
panic = "abort"
