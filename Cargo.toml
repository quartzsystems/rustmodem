[workspace]
resolver = "3"
members = [
    # DSP: signal processing shared by every modulation.
    "dsp/g711",
    "dsp/dspkit",
    # Modem: the engine trait every softmodem implements, and the null engine.
    "modem/engine",
    # DTE: what the host sees on the COM port.
    "dte/at",
    "dte/serial",
    # VoIP: the telephone side.
    "voip/sdp",
    "voip/rtp",
    "voip/sip",
    # Service: the pool, its configuration, its messages and its control API.
    "service/msg",
    "service/config",
    "service/ctlproto",
    "service/ctlsrv",
    "service/pipe",
    "service/pool",
    "service/media",
    "service/telephony",
    "service/svc",
    # UI: the manager.
    "ui/model",
    "ui/glyph",
    "ui/win32",
    "ui/manager",
    # Tools: the command-line client, the demo service and the test peer.
    "tools/ctl",
    "tools/demosvc",
    "tools/sippeer",
]
# The fuzz targets build with cargo-fuzz on a nightly toolchain and keep
# their own lockfile.
exclude = ["tools/fuzz"]

[workspace.package]
# Kept equal to the VERSION file; ci/version.sh checks it.
version = "0.0.4"
edition = "2024"
license = "MIT"
authors = ["Quartz Systems"]
publish = false

[workspace.dependencies]
# Third-party crates.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = "0.25.21"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
windows = "0.62.2"
windows-service = "0.8.1"
# The lock-free rings between the pool and the media of a call.
rtrb = "0.4.1"
# Random tags, branches, Call-IDs, nonces and SSRCs.
getrandom = "0.4.3"
# Digest authentication in voip/sip.
md-5 = "0.11.0"
sha2 = "0.11.2"
# The runtime of the service's I/O shell: the control server, the named
# pipe, the SIP socket and the pool's task. Never a dependency of a pure
# crate or of a media thread; docs/RUNTIME.md says where it may be.
tokio = { version = "1.54.1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "macros",
    "io-util",
] }
# For the screenshot tests of the manager, which read their goldens.
png = "0.18.1"

# The workspace's own crates.
g711 = { path = "dsp/g711" }
engine = { path = "modem/engine" }
at = { path = "dte/at" }
serial = { path = "dte/serial" }
sdp = { path = "voip/sdp" }
rtp = { path = "voip/rtp" }
sip = { path = "voip/sip" }
msg = { path = "service/msg" }
config = { path = "service/config" }
ctlproto = { path = "service/ctlproto" }
ctlsrv = { path = "service/ctlsrv" }
pipe = { path = "service/pipe" }
pool = { path = "service/pool" }
media = { path = "service/media" }
sippeer = { path = "tools/sippeer" }
svc = { path = "service/svc" }
telephony = { path = "service/telephony" }
model = { path = "ui/model" }
glyph = { path = "ui/glyph" }
win32 = { path = "ui/win32" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
panic = "abort"
