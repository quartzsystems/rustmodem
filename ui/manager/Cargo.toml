[package]
name = "manager"
description = "The rustmodem Manager: the operator's window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ctlproto.workspace = true
model.workspace = true
msg.workspace = true
serde.workspace = true
serde_json.workspace = true

# The window is Windows only, like the wrappers it is built on.
[target."cfg(windows)".dependencies]
ctlsrv.workspace = true
glyph.workspace = true
pipe.workspace = true
win32.workspace = true

[build-dependencies]
glyph.workspace = true

[dev-dependencies]
png.workspace = true

[lints]
workspace = true

[[bin]]
name = "rustmodem-gui"
path = "src/main.rs"

# The screenshot tests are a program of their own: one window after the
# other on one thread, with a report at the end.
[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
harness = false
