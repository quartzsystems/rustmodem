# The rustmodem message catalogue.
#
# One table per message. The table name is the message id: RMD and four
# digits. Each message has:
#
#   severity   info, warning or error
#   vars       how many substitution variables (&1 to &9) the texts take
#   text       the one-line first-level text
#   cause      second-level text, part one
#   recovery   second-level text, part two
#
# Number ranges:
#
#   0001-0999  service and configuration
#   1000-1999  lines and AT
#   2000-2999  control API
#   3000-3999  serial
#   4000-4999  manager
#   5000-5999  telephony
#   6000-6999  media
#   7000-7999  modem
#   8000-8999  link: error control and compression
#   9000-9499  driver and ports
#   9500-9999  setup

# ---------------------------------------------------------------------------
# 0001-0999: service and configuration
# ---------------------------------------------------------------------------

[RMD0001]
severity = "info"
vars = 1
text = "rustmodem service started, version &1."
cause = "The service finished starting and is serving its lines."
recovery = "No action is needed."

[RMD0002]
severity = "info"
vars = 0
text = "rustmodem service stopped."
cause = "The service was asked to stop. Every call was hung up and every port released."
recovery = "No action is needed."

[RMD0003]
severity = "error"
vars = 1
text = "rustmodem service ended abnormally: &1"
cause = "The service met an error it could not continue from."
recovery = "Look at the service log for earlier messages, correct the problem and start the service again."

[RMD0004]
severity = "info"
vars = 1
text = "Service &1 installed."
cause = "The service was registered with the Windows service control manager."
recovery = "Start it with: net start &1"

[RMD0005]
severity = "info"
vars = 1
text = "Service &1 removed."
cause = "The service was removed from the Windows service control manager."
recovery = "No action is needed."

[RMD0006]
severity = "error"
vars = 2
text = "Service &1 could not be installed: &2"
cause = "The Windows service control manager refused the registration. The service may already be installed, or the command was not run as an administrator."
recovery = "Run the command from an elevated prompt. If the service is already installed, remove it first."

[RMD0007]
severity = "error"
vars = 2
text = "Service &1 could not be removed: &2"
cause = "The Windows service control manager refused the removal. The service may not be installed, or the command was not run as an administrator."
recovery = "Run the command from an elevated prompt and check that the service is installed."

[RMD0008]
severity = "error"
vars = 1
text = "The service could not connect to the service control manager: &1"
cause = "The program was started with no arguments, which is how the Windows service control manager starts it, but it was not started as a service."
recovery = "To run in the foreground use --console. To run as a service use --install and then start the service."

[RMD0009]
severity = "error"
vars = 1
text = "Command-line argument &1 is not recognised."
cause = "The command line has an argument, or a combination of arguments, that the program does not accept."
recovery = "Run the program with --help to see the arguments it accepts."

[RMD0010]
severity = "error"
vars = 2
text = "Configuration file &1 could not be read: &2"
cause = "The file does not exist or the service is not allowed to read it."
recovery = "Create the file or correct its permissions, then try again."

[RMD0011]
severity = "error"
vars = 2
text = "Configuration file &1 could not be written: &2"
cause = "The service is not allowed to write the file, or the disk is full."
recovery = "Correct the permissions of the file and its directory, then repeat the change."

[RMD0012]
severity = "error"
vars = 2
text = "Configuration is not valid TOML at line &1: &2"
cause = "The configuration file could not be parsed."
recovery = "Correct the file at the line given and try again."

[RMD0013]
severity = "error"
vars = 3
text = "Key &1 at line &2 has the wrong type; &3 expected."
cause = "The value given for the key is not of the type the key takes."
recovery = "Correct the value and try again."

[RMD0014]
severity = "error"
vars = 4
text = "Key &1 at line &2 has value &3, which is not allowed."
cause = "The value is outside what the key accepts. Allowed: &4."
recovery = "Correct the value and try again."

[RMD0015]
severity = "error"
vars = 2
text = "Required key &1 is missing from the table at line &2."
cause = "The table must have the key and it has no default."
recovery = "Add the key and try again."

[RMD0016]
severity = "error"
vars = 3
text = "Line id &1 at line &2 is already used at line &3."
cause = "Two lines have the same id. Every line needs its own id."
recovery = "Give one of the lines a different id and try again."

[RMD0017]
severity = "error"
vars = 3
text = "Serial port &1 at line &2 is already used at line &3."
cause = "Two lines name the same serial port. A port can serve one line only."
recovery = "Give one of the lines a different port and try again."

[RMD0018]
severity = "error"
vars = 2
text = "Serial backend &1 at line &2 is not known."
cause = "The backend named for the line is not one this version of rustmodem has. Known backends: com0com and vcom."
recovery = "Correct the backend name and try again."

[RMD0019]
severity = "error"
vars = 1
text = "Line &1 is not in the configuration."
cause = "The change names a line id that the configuration does not have."
recovery = "List the lines to see which ids exist, then repeat the change with one of them."

[RMD0020]
severity = "error"
vars = 1
text = "Line &1 is already in the configuration."
cause = "A line cannot be added with an id that the configuration already has."
recovery = "Choose an id that is not in use, or edit the existing line."

[RMD0021]
severity = "info"
vars = 2
text = "Configuration loaded from &1: &2 lines."
cause = "The configuration file was read and found valid."
recovery = "No action is needed."

[RMD0022]
severity = "error"
vars = 2
text = "Log directory &1 could not be used: &2"
cause = "The directory could not be created, or a log file in it could not be opened for writing."
recovery = "Correct log_dir in the configuration or the permissions of the directory, then start the service again."

[RMD0023]
severity = "error"
vars = 1
text = "The Ctrl+C handler could not be set: &1"
cause = "Windows refused the console control handler, so the service could not be stopped cleanly from the keyboard."
recovery = "Run the service from an ordinary console window."

[RMD0024]
severity = "warning"
vars = 2
text = "Stored profiles file &1 could not be read: &2"
cause = "The file that keeps what AT&W stored for each line is not valid TOML, or the service is not allowed to read it. Every line starts from its factory settings."
recovery = "Correct or delete the file. It is written again the next time a host gives AT&W."

[RMD0025]
severity = "warning"
vars = 2
text = "Stored profiles file &1 could not be written: &2"
cause = "The service is not allowed to write the file, or the disk is full. The profile is in effect until the service stops and is then lost."
recovery = "Correct the permissions of the file and its directory, then give AT&W again."

[RMD0026]
severity = "warning"
vars = 3
text = "The stored profile of line &1 in &2 is not valid: &3"
cause = "The profile has a value that no AT command could have stored. The line starts from its factory settings."
recovery = "Correct or delete the profile in the file, or give AT&W on the line to store it again."

[RMD0027]
severity = "error"
vars = 3
text = "Hunt group &1 at line &2 names line &3, which does not exist."
cause = "A hunt group can only hold lines that the configuration has."
recovery = "Add the line, or take it out of the hunt group, and try again."

[RMD0028]
severity = "error"
vars = 3
text = "Hunt group name &1 at line &2 is already used at line &3."
cause = "Two hunt groups have the same name. Routes name a group by its name, so every group needs its own."
recovery = "Give one of the hunt groups a different name and try again."

[RMD0029]
severity = "error"
vars = 3
text = "Pilot number &1 at line &2 is already used at line &3."
cause = "Two hunt groups have the same pilot number. A call to the number can go to one group only."
recovery = "Give one of the hunt groups a different pilot number and try again."

[RMD0030]
severity = "error"
vars = 3
text = "Route &1 at line &2 has target &3, which does not exist."
cause = "A route sends its calls to a line or to a hunt group that the configuration has."
recovery = "Correct the target, or add the line or the hunt group, and try again."

[RMD0031]
severity = "warning"
vars = 4
text = "Route &1 at line &2 never gets a call: route &3 at line &4 takes them first."
cause = "Routes are tried in the order of the file, and an earlier route matches every number this one matches."
recovery = "Move the more specific route above the other, or remove the route that is not needed."

[RMD0032]
severity = "error"
vars = 1
text = "Hunt group &1 is not in the configuration."
cause = "A change was asked for to a hunt group that the configuration does not have."
recovery = "List the hunt groups with: rustmodem-ctl groups"

[RMD0033]
severity = "error"
vars = 1
text = "Hunt group &1 is already in the configuration."
cause = "A hunt group was to be added, or renamed, with a name that another hunt group has."
recovery = "Choose a name that is not in use, or change the group that has it."

[RMD0034]
severity = "error"
vars = 2
text = "There is no route at position &1: the configuration has &2 routes."
cause = "A route is named by its position in the list, from 0. The routes may have been changed since they were listed."
recovery = "List the routes again with: rustmodem-ctl routes"

[RMD0035]
severity = "error"
vars = 1
text = "The registration of line &1 is not complete."
cause = "A line that registers to a PBX needs the server, the user and the password. One of them was not given and the line has none."
recovery = "Give the server, the user and the password together."

[RMD0999]
severity = "error"
vars = 1
text = "Message &1 is not in the message catalogue."
cause = "The program asked for a message id that the catalogue does not have. This is an error in rustmodem."
recovery = "Report the problem to Quartz Systems with the message id."

# ---------------------------------------------------------------------------
# 1000-1999: lines and AT
# ---------------------------------------------------------------------------
[RMD1001]
severity = "error"
vars = 1
text = "Line &1 does not exist."
cause = "The request names a line id that the service does not have."
recovery = "List the lines to see which ids exist, then repeat the request with one of them."

[RMD1002]
severity = "error"
vars = 1
text = "Line &1 is disabled."
cause = "The request needs the line to be enabled."
recovery = "Enable the line and repeat the request."

[RMD1003]
severity = "error"
vars = 2
text = "Line &1 is not ringing; its state is &2."
cause = "A line can be answered only while a call is ringing on it."
recovery = "Wait for the line to ring, then repeat the request."

[RMD1004]
severity = "error"
vars = 1
text = "Line &1 has no call to hang up."
cause = "The line is neither connecting nor connected."
recovery = "No action is needed."

[RMD1005]
severity = "info"
vars = 2
text = "Line &1 state is now &2."
cause = "The line changed state."
recovery = "No action is needed."

[RMD1006]
severity = "info"
vars = 3
text = "Line &1 call started: &2, number &3."
cause = "The line dialled a number or was offered a call."
recovery = "No action is needed."

[RMD1007]
severity = "info"
vars = 2
text = "Line &1 call connected at &2 bit/s."
cause = "The modems on both ends of the call finished connecting. A rate of 0 means the rate is not known."
recovery = "No action is needed."

[RMD1008]
severity = "info"
vars = 4
text = "Line &1 call ended: &2; &3 bytes sent, &4 bytes received."
cause = "The call on the line finished for the reason given."
recovery = "No action is needed."

[RMD1009]
severity = "info"
vars = 1
text = "Line &1 was reset."
cause = "The line was reset on request. Any call on it was hung up and its modem settings returned to its stored profile, or to the factory defaults if it has none."
recovery = "No action is needed."

[RMD1010]
severity = "info"
vars = 1
text = "Line &1 added."
cause = "The line was added to the service from the configuration."
recovery = "No action is needed."

[RMD1011]
severity = "info"
vars = 1
text = "Line &1 removed."
cause = "The line is no longer in the configuration. Any call on it was hung up and its port released."
recovery = "No action is needed."

[RMD1012]
severity = "info"
vars = 1
text = "Line &1 changed."
cause = "The configuration of the line changed and the service applied the change."
recovery = "No action is needed."

[RMD1013]
severity = "warning"
vars = 1
text = "A call record could not be written: &1"
cause = "The service could not append to the call records file. The record is still held in memory."
recovery = "Check the log directory for free space and correct permissions."

[RMD1014]
severity = "info"
vars = 1
text = "Line &1 stored its profile."
cause = "The host gave AT&W, and the settings and registers of the line were kept as its stored profile."
recovery = "No action is needed."

# ---------------------------------------------------------------------------
# 2000-2999: control API
# ---------------------------------------------------------------------------

[RMD2001]
severity = "error"
vars = 2
text = "Control protocol &1 is not supported; this service supports protocol &2."
cause = "The client and the service were built for different versions of the control protocol."
recovery = "Use a client of the same version as the service."

[RMD2002]
severity = "error"
vars = 1
text = "Control method &1 is not known."
cause = "The request names a method that this version of the service does not have."
recovery = "Correct the method name. The methods are listed in docs/CONTROL_API.md."

[RMD2003]
severity = "error"
vars = 2
text = "Parameters of control method &1 are not valid: &2"
cause = "A parameter is missing, has the wrong type, or is not one the method takes."
recovery = "Correct the parameters. They are listed for each method in docs/CONTROL_API.md."

[RMD2004]
severity = "error"
vars = 1
text = "Control message is not valid: &1"
cause = "The message is not one JSON object on one line, or it is missing the fields a request needs."
recovery = "Send each request as one JSON object with id and method, ended by a line feed."

[RMD2005]
severity = "error"
vars = 0
text = "The first control message must be hello."
cause = "A client sent something else before saying hello."
recovery = "Send hello with the protocol number and client version first."

[RMD2006]
severity = "warning"
vars = 1
text = "Control client &1 was disconnected because it fell too far behind."
cause = "The client did not read its events as fast as the service produced them, and its queue filled."
recovery = "Connect again. A client that subscribes to events must keep reading them."

[RMD2007]
severity = "error"
vars = 2
text = "Control pipe &1 could not be created: &2"
cause = "Windows refused the named pipe. Another copy of the service may be running with the same pipe name."
recovery = "Stop the other copy, or give this one a different pipe name in the configuration."

[RMD2008]
severity = "error"
vars = 2
text = "Control pipe &1 could not be opened: &2"
cause = "The service is not running, it uses a different pipe name, or this user is not allowed to open the pipe. The pipe is open to SYSTEM and Administrators only."
recovery = "Start the service, check the pipe name, and run the command from an elevated prompt."

[RMD2009]
severity = "error"
vars = 1
text = "The connection to the service was lost: &1"
cause = "The service closed the connection or stopped."
recovery = "Check that the service is running and try again."

[RMD2010]
severity = "error"
vars = 0
text = "The service is stopping."
cause = "The request arrived while the service was shutting down, so it was not carried out."
recovery = "Start the service and repeat the request."

[RMD2011]
severity = "info"
vars = 1
text = "Control client &1 connected."
cause = "A client opened the control pipe and completed the hello exchange."
recovery = "No action is needed."

[RMD2012]
severity = "info"
vars = 1
text = "Control client &1 disconnected."
cause = "The client closed its connection."
recovery = "No action is needed."

[RMD2013]
severity = "error"
vars = 1
text = "The reply from the service was not understood: &1"
cause = "The service sent something this client cannot read. The client and the service may be different versions."
recovery = "Use a client of the same version as the service."

[RMD2014]
severity = "error"
vars = 1
text = "Control message is longer than &1 bytes."
cause = "A control message must fit on one line within the size limit."
recovery = "Send a shorter message."

# ---------------------------------------------------------------------------
# 3000-3999: serial
# ---------------------------------------------------------------------------

[RMD3001]
severity = "error"
vars = 2
text = "Serial port &1 could not be opened: &2"
cause = "The port does not exist, is in use by another program, or the service is not allowed to open it."
recovery = "Check the port name against the com0com set-up in docs/COM0COM.md and that nothing else has the port open. The service tries again by itself."

[RMD3002]
severity = "error"
vars = 2
text = "Serial port &1 read failed: &2"
cause = "Windows reported an error reading from the port. The port may have been removed."
recovery = "Check that the port still exists. The service closes the port and tries to open it again by itself."

[RMD3003]
severity = "error"
vars = 2
text = "Serial port &1 write failed: &2"
cause = "Windows reported an error writing to the port. The port may have been removed."
recovery = "Check that the port still exists. The service closes the port and tries to open it again by itself."

[RMD3004]
severity = "error"
vars = 2
text = "Serial port &1 modem signals could not be set: &2"
cause = "Windows reported an error changing the output lines of the port."
recovery = "Check that the port still exists and that the pair is set up as docs/COM0COM.md describes."

[RMD3005]
severity = "error"
vars = 2
text = "Serial port &1 status could not be read: &2"
cause = "Windows reported an error reading the input lines of the port."
recovery = "Check that the port still exists. The service closes the port and tries to open it again by itself."

[RMD3006]
severity = "error"
vars = 2
text = "Serial port &1 could not be configured: &2"
cause = "The port was opened but Windows refused its settings."
recovery = "Check that the port is a com0com port set up as docs/COM0COM.md describes."

[RMD3007]
severity = "error"
vars = 1
text = "Serial backend &1 is not available on this platform."
cause = "The backend works on Windows only."
recovery = "Run the service on Windows."

[RMD3008]
severity = "info"
vars = 1
text = "Serial port &1 opened."
cause = "The service opened the port for its line."
recovery = "No action is needed."

# ---------------------------------------------------------------------------
# 4000-4999: manager
# ---------------------------------------------------------------------------

[RMD4001]
severity = "error"
vars = 2
text = "The service did not answer &1 within &2 seconds."
cause = "The request was sent and no answer came back. The service may be busy, or stopping."
recovery = "Check that the service is running, then try again."

[RMD4002]
severity = "error"
vars = 2
text = "File &1 could not be written: &2"
cause = "The folder does not exist, the file is open in another program, or this user is not allowed to write there."
recovery = "Choose another name or folder, or close the program that has the file open, then try again."

[RMD4003]
severity = "error"
vars = 3
text = "Service &1 could not be &2: &3"
cause = "The Windows service control manager refused the request. The service may not be installed, or the manager is not running as an administrator."
recovery = "Install the service from the File menu if it is not installed, and try again as an administrator."

[RMD4004]
severity = "error"
vars = 1
text = "The manager could not be started again as an administrator: &1"
cause = "Windows did not start the elevated copy of the manager. The request for administrator rights may have been declined."
recovery = "Choose the command again and accept the request, or start the manager from an elevated prompt."

[RMD4005]
severity = "error"
vars = 2
text = "Program &1 could not be run: &2"
cause = "The service program is installed beside the manager and was not found there, or could not be started."
recovery = "Check that rustmodem-svc.exe is in the same folder as the manager, then try again."

[RMD4006]
severity = "error"
vars = 2
text = "Serial port &1 could not be opened: &2"
cause = "The port does not exist on this computer, or another program has it open."
recovery = "Choose another port, or close the program that has the port open, then try again."

[RMD4007]
severity = "error"
vars = 2
text = "Serial port &1 stopped working: &2"
cause = "Windows reported an error reading from or writing to the port. The port may have been removed."
recovery = "Open the port again."

[RMD4008]
severity = "error"
vars = 3
text = "&1 must be a whole number from &2 to &3."
cause = "The field holds something that is not a number, or a number outside what it takes."
recovery = "Correct the field and try again."

[RMD4009]
severity = "error"
vars = 1
text = "&1 must not be empty."
cause = "The field has to be filled in."
recovery = "Fill in the field and try again."

[RMD4010]
severity = "info"
vars = 2
text = "Service &1 was &2."
cause = "The Windows service control manager carried out the request."
recovery = "No action is needed."

[RMD4011]
severity = "info"
vars = 1
text = "Changes to the settings take effect when the service next starts."
cause = "The settings were written to &1. The log level, the log directory and the control pipe are read when the service starts."
recovery = "Restart the service now, or later from the File menu."

[RMD4012]
severity = "error"
vars = 2
text = "The service program reported a problem: &2"
cause = "&1 ran and ended with an error."
recovery = "Read the message, correct what it names, and try again."

[RMD4013]
severity = "info"
vars = 1
text = "&1"
cause = "The service program ran and ended without an error."
recovery = "No action is needed."

[RMD4014]
severity = "error"
vars = 2
text = "Folder &1 could not be opened: &2"
cause = "The folder does not exist yet, because no call has been captured, or it is on another computer than the one the manager runs on."
recovery = "Turn capture on for a line and wait for a call on it. The folder is on the computer the service runs on."

[RMD4015]
severity = "error"
vars = 0
text = "A modem must be allowed at least one modulation."
cause = "No modulation is checked in the list. A modem with none could make no call and answer none."
recovery = "Check at least one modulation."

# ---------------------------------------------------------------------------
# 5000-5999: telephony
# ---------------------------------------------------------------------------

[RMD5001]
severity = "info"
vars = 1
text = "SIP is listening on &1."
cause = "The service opened its SIP port. It takes calls from the trusted peers and from the registrars of its lines."
recovery = "No action is needed."

[RMD5002]
severity = "error"
vars = 2
text = "SIP could not listen on &1: &2"
cause = "The address is not one of this computer's, or another program has the port. The service runs without SIP."
recovery = "Correct sip.listen in the configuration, or stop the other program, and start the service again."

[RMD5003]
severity = "info"
vars = 3
text = "Line &1 is registered to &2 for &3 seconds."
cause = "The registrar accepted the registration. Calls to the line's extension are sent to this line."
recovery = "No action is needed."

[RMD5004]
severity = "warning"
vars = 2
text = "Registrar &2 did not answer the registration of line &1."
cause = "No response came to the REGISTER request. The service tries again after 5, 10, 20 and 40 seconds and then every minute."
recovery = "Check that the registrar is running and can be reached, and that the server in the line's register settings is right."

[RMD5005]
severity = "error"
vars = 2
text = "Registrar &2 refused the user name or the password of line &1."
cause = "The registrar asked for credentials and did not accept the ones the line has, or the line has no password."
recovery = "Correct the user, the password or the authentication user in the line's register settings."

[RMD5006]
severity = "error"
vars = 2
text = "Registrar &2 asked line &1 for authentication that rustmodem does not have."
cause = "The registrar offered no Digest challenge with MD5 or SHA-256 and qop auth."
recovery = "Set the registrar to use Digest authentication with MD5 or SHA-256 for this extension."

[RMD5007]
severity = "warning"
vars = 3
text = "Registrar &2 answered the registration of line &1 with &3."
cause = "The registrar refused the registration. The service tries again after 5, 10, 20 and 40 seconds and then every minute."
recovery = "Look the status up in the registrar's documentation, and check the extension there and the line's register settings."

[RMD5008]
severity = "error"
vars = 2
text = "The address of &2 could not be found for line &1."
cause = "The name did not resolve to an IPv4 address. The service tries again every minute."
recovery = "Correct the server in the line's register settings, or the name in DNS."

[RMD5009]
severity = "info"
vars = 2
text = "Line &1 is no longer registered to &2."
cause = "The registration was removed: the service is stopping, or the line's register settings were changed or removed."
recovery = "No action is needed."

[RMD5010]
severity = "warning"
vars = 2
text = "A SIP request from &1 was dropped: the address is not a trusted peer. &2 dropped since the service started."
cause = "Requests are taken only from the addresses in sip.trusted_peers and, for a registered line, from the line's registrar."
recovery = "If the address is a gateway or a PBX of yours, add it to sip.trusted_peers. Otherwise no action is needed."

[RMD5011]
severity = "info"
vars = 4
text = "A call from &1 to &2 was turned away with &3 &4."
cause = "No route or hunt group has the number, every line it could go to is busy or not ready, or the caller offered no G.711 audio."
recovery = "If the call should have been taken, check the routes, the hunt groups and the state of their lines."

[RMD5012]
severity = "error"
vars = 1
text = "No RTP port in &1 is free."
cause = "Every even port of media.rtp_ports is in use, by calls or by other programs. The call was turned away."
recovery = "Widen media.rtp_ports, or stop the program that has its ports."

[RMD5013]
severity = "warning"
vars = 1
text = "The far end did not acknowledge the answer of line &1."
cause = "No ACK came for the 200 OK in 32 seconds. The call was ended with BYE."
recovery = "Check that the far end can reach this computer's SIP port, and that sip.address is an address it can route to."

[RMD5014]
severity = "error"
vars = 2
text = "Line &1 could not dial: the address of &2 could not be found."
cause = "The name of the registrar or of sip.outbound_peer did not resolve to an IPv4 address."
recovery = "Correct the name in the configuration, or in DNS."

# ---------------------------------------------------------------------------
# 6000-6999: media
# ---------------------------------------------------------------------------

[RMD6001]
severity = "warning"
vars = 1
text = "The media of the call on line &1 stopped arriving."
cause = "Nothing was received from the far end for media.rtp_timeout_s seconds. The call was cleared."
recovery = "If it happens during calls that should go on, check the network between the far end and this computer."

[RMD6002]
severity = "error"
vars = 1
text = "The media of the call on line &1 could not be started."
cause = "The call connected and its media could not be carried. The call was ended."
recovery = "Look at the service log for earlier messages. If there are none, report the problem to Quartz Systems."

[RMD6003]
severity = "error"
vars = 2
text = "Capture file &1 could not be read: &2"
cause = "The file does not exist, or the program is not allowed to read it."
recovery = "Check the path. Capture files are in the captures directory under the log directory, or in media.capture_dir."

[RMD6004]
severity = "error"
vars = 2
text = "File &1 is not a call capture that can be read: &2"
cause = "The file is not a capture, was written by a later version of rustmodem, or was cut off or damaged."
recovery = "Name a .rmcap file that rustmodem wrote. A capture that was cut off while the service ran can be read once the call has ended."

[RMD6005]
severity = "error"
vars = 2
text = "File &1 could not be written: &2"
cause = "The directory does not exist, the program is not allowed to write there, or the disk is full."
recovery = "Name a file in a directory that can be written to."

[RMD6006]
severity = "info"
vars = 2
text = "The call on line &1 is being captured to &2."
cause = "Call capture is on for the line. Every RTP packet the call receives and sends is written to the file."
recovery = "No action is needed. Check the capture with: rustmodem-ctl capture check <file>"

[RMD6007]
severity = "warning"
vars = 3
text = "The capture of the call on line &1 could not be written to &2: &3"
cause = "The capture directory could not be made or the file could not be written. The call is not affected; its capture is given up."
recovery = "Correct media.capture_dir or the permissions of the directory, or free space on the disk."

# ---------------------------------------------------------------------------
# 7000-7999: modem
# ---------------------------------------------------------------------------

[RMD7001]
severity = "warning"
vars = 2
text = "The modem on line &1 did not connect: it gave up in the state &2."
cause = "The far end sent no answer tone or carrier the modem knows, the two modems have no modulation in common, or the line is too poor for the carrier to be held. The state is where the handshake stopped; docs/MODEM.md lists the states."
recovery = "Check that the far end is a modem of 300 bit/s (V.21 or Bell 103) and that the gateway carries the call as G.711 with no echo canceller, silence suppression or jitter buffer adaptation. Capture a call to see what was received."

[RMD7002]
severity = "error"
vars = 2
text = "Line &1 cannot be in a self-test: it is &2."
cause = "A self-test takes two lines that are idle: in service, with their ports open, and with no call. The line is disabled, not ready, in a call or in a self-test already."
recovery = "Wait for the line to be idle, or choose another line."

[RMD7003]
severity = "error"
vars = 2
text = "Line &1 cannot be in a self-test: its engine is &2, not the modem."
cause = "A self-test joins the modems of two lines. The line's engine is one that carries data with no modem."
recovery = "Choose a line whose engine is modem, or set the line's engine to modem."

[RMD7004]
severity = "error"
vars = 1
text = "A self-test takes two lines, and line &1 was named twice."
cause = "The self-test joins the modem of one line to the modem of another."
recovery = "Name two different lines."

[RMD7005]
severity = "error"
vars = 4
text = "The self-test of lines &1 and &2 failed: the modems did not connect. The modem of line &3 got as far as the state &4."
cause = "The settings of the two lines give their modems no way to connect, most often because they have no modulation in common; or the modem is at fault. The test joins the two modems directly, so the network and the hosts have no part in it."
recovery = "Compare the modem settings of the two lines: they need a modulation in common. If they have one, report the failure with the version of rustmodem."

[RMD7006]
severity = "error"
vars = 5
text = "The self-test of lines &1 and &2 failed: of &5 octets each way, &3 arrived whole at line &2 and &4 at line &1."
cause = "The modems connected and then lost or changed data, or lost each other's carrier. The test joins the two modems directly, so the modem is at fault."
recovery = "Report the failure with the version of rustmodem and the modem settings of the two lines."

# ---------------------------------------------------------------------------
# 8000-8999: link: error control and compression
# ---------------------------------------------------------------------------

[RMD8001]
severity = "warning"
vars = 1
text = "The call on line &1 was cleared: error control is required and the far end has none."
cause = "The modems connected, and the far end did not answer the detection phase of V.42: it has no error control, or has it turned off. The line's policy, or the host with AT+ES, AT\\N2, AT\\N4 or S36, asks for error control or no call."
recovery = "Turn error control on at the far end. To take calls without it, set error_control to auto in [modem] or on the line, and check what the host's initialisation sets with AT+ES?."

[RMD8002]
severity = "warning"
vars = 2
text = "The error-corrected connection on line &1 ended, and the call with it: &2."
cause = "LAPM's connection ended under the call. remote: the far end released it, as it does when its host hangs up. timed-out: the far end stopped answering, which is a line that no longer carries the signal. no-response and no-protocol: the far end said it had error control and did not go on with it. protocol and compression: the far end sent what V.42 or V.42bis does not allow. refused and local: the far end refused the connection, or this end released it."
recovery = "remote needs nothing. For timed-out, look at the call's RTP statistics and the modem's diagnostics for a path that loses packets or changes the audio. For protocol and compression, capture a call and report it with the version of rustmodem and the make of the far modem."

# ---------------------------------------------------------------------------
# 9000-9499: driver and ports
# ---------------------------------------------------------------------------

[RMD9001]
severity = "error"
vars = 1
text = "&1 is not a RustModem port."
cause = "The line's serial backend is vcom, and there is no port of that name, or the port belongs to another driver. The service does not create ports: that needs an administrator, and is done by the setup program."
recovery = "Create the port with rustmodem-setup port add --com followed by the number, or in RustModem Manager under Ports and drivers, or give the line the name of a port that rustmodem-setup port list shows. The service tries again by itself."

[RMD9002]
severity = "error"
vars = 1
text = "The service may not open RustModem port &1, or another program has its control side."
cause = "The control side of a port is opened by the system, by an administrator or by the service's own account, and by one program at a time. The service is running under another account, or a second copy of the service or a test program has the port."
recovery = "Stop whatever else has the port. If the service was installed by hand, install it with rustmodem-setup, which gives it its account. The service tries again by itself."

[RMD9003]
severity = "error"
vars = 3
text = "The driver of RustModem port &1 speaks version &2 of the control interface, and this service speaks version &3."
cause = "The driver and the service are from different versions of RustModem, as after an upgrade that replaced one and not the other."
recovery = "Run rustmodem-setup repair, which installs the driver and the service of one version."

[RMD9004]
severity = "info"
vars = 1
text = "RustModem port &1 was created, with its modem."
cause = "A COM port and the modem attached to it were made for a line."
recovery = "Give the port's name to a line: serial = { backend = \"vcom\", port = \"&1\" } in the configuration, or New line in RustModem Manager."

[RMD9005]
severity = "info"
vars = 1
text = "RustModem port &1 was removed, with its modem."
cause = "The port's two devices were removed."
recovery = "A line that named the port has no port now: remove the line or give it another."

[RMD9006]
severity = "error"
vars = 1
text = "&1 cannot be the port's name: the number is taken, or is not a COM number."
cause = "Another port has the name, or Windows has the number set aside for a device that is not connected now. COM numbers are 1 to 256."
recovery = "Give another number, or leave --com out and the next free number from COM10 is used. rustmodem-setup port list shows the RustModem ports."

[RMD9008]
severity = "error"
vars = 2
text = "RustModem port &1 could not be created: &2"
cause = "Windows refused the port's device or its modem's. Nothing of the port was left behind, and no port made by the same command was kept."
recovery = "Run rustmodem-setup repair, which puts the driver package back, and try again. If it fails again, the log of this run and of C:\\Windows\\INF\\setupapi.dev.log say why."

[RMD9009]
severity = "error"
vars = 2
text = "RustModem port &1 could not be removed: &2"
cause = "Windows refused to remove the port's device or its modem's, as it does while a program has the port open."
recovery = "Stop the service and close whatever has the port open, and try again."

[RMD9010]
severity = "error"
vars = 0
text = "The RustModem driver is not installed."
cause = "A port needs the driver package in Windows' driver store, where the setup program puts it. It is not there."
recovery = "Run rustmodem-setup, or rustmodem-setup repair if RustModem is installed."

[RMD9011]
severity = "error"
vars = 0
text = "There are not enough free COM numbers for the ports asked for."
cause = "COM numbers end at 256, and those from the first one tried to the last are taken."
recovery = "Ask for fewer ports, or start at a lower number with --com."

[RMD9012]
severity = "error"
vars = 1
text = "The RustModem ports could not be listed: &1"
cause = "Windows refused to list its devices."
recovery = "Try again. If it goes on, restart Windows."

# ---------------------------------------------------------------------------
# 9500-9999: setup
# ---------------------------------------------------------------------------

[RMD9500]
severity = "info"
vars = 1
text = "RustModem &1 is installed."
cause = "The setup program finished, and the service is running."
recovery = "Start RustModem Manager from the Start menu to add lines."

[RMD9501]
severity = "info"
vars = 2
text = "RustModem was upgraded from &1 to &2."
cause = "The programs and the driver were replaced. The configuration, the logs, the lines and their ports are as they were."
recovery = "No action is needed."

[RMD9502]
severity = "info"
vars = 1
text = "RustModem &1 was repaired."
cause = "Every file, the driver package, the service and what Windows has registered for RustModem were put back as an install makes them."
recovery = "No action is needed."

[RMD9503]
severity = "info"
vars = 0
text = "RustModem was removed."
cause = "The ports, the driver, the service, the firewall rules, the QoS policy and the programs are gone. The configuration and the logs are kept unless --purge was given."
recovery = "No action is needed."

[RMD9504]
severity = "error"
vars = 0
text = "Setup needs an administrator."
cause = "Installing a driver, a service and devices is not something an ordinary user may do, and the request to run as an administrator was refused or could not be made."
recovery = "Run the setup program again and answer Yes when Windows asks, or run it from a prompt started as an administrator."

[RMD9505]
severity = "error"
vars = 1
text = "RustModem does not run on this Windows: build &1."
cause = "RustModem needs 64-bit Windows 10 version 1803, build 17134, or later: Windows 11, Windows Server 2022 or Windows Server 2025."
recovery = "Install it on one of those."

[RMD9506]
severity = "error"
vars = 1
text = "This setup program cannot install: &1."
cause = "The files it carries are missing or do not match their checksum. The copy kept in the install directory has them; a copy of the bare program does not, and a download that was cut short has them damaged."
recovery = "Get the setup program again."

[RMD9507]
severity = "error"
vars = 2
text = "Setup failed at &1: &2"
cause = "A step of the install could not be done. Everything done before it has been undone: the machine is as it was."
recovery = "Correct what the step ran into and run the setup program again. The log of this run has every step."

[RMD9508]
severity = "error"
vars = 0
text = "RustModem is not installed."
cause = "There is no install on this machine to repair or remove."
recovery = "Run the setup program with no command to install."

[RMD9509]
severity = "error"
vars = 0
text = "The lab certificate was not accepted, and nothing was installed."
cause = "This is a lab build: its driver is signed by a certificate made for testing, which Windows installs a driver from only once the machine trusts it. Trusting it was declined, or the install was silent and was not told to."
recovery = "Run the setup program again and accept, or add --trust-lab-certificate to a silent install. On a machine that should not trust a lab certificate, use a build signed for distribution."

[RMD9510]
severity = "error"
vars = 2
text = "RustModem &1 is installed, which is newer than this setup program's &2."
cause = "The setup program does not replace an install with an older one."
recovery = "Use the newer setup program, or remove RustModem first."

[RMD9511]
severity = "warning"
vars = 2
text = "&1 could not be undone: &2"
cause = "While a failed install was being undone, one step could not be taken back. The rest were."
recovery = "Run rustmodem-setup uninstall to remove what is left, then install again."

[RMD9512]
severity = "error"
vars = 1
text = "The arguments were not understood: &1."
cause = "The command line of the setup program is not one it has."
recovery = "rustmodem-setup --help lists the commands and their options."

[RMD9513]
severity = "warning"
vars = 2
text = "&1 could not be done: &2"
cause = "A step of removing RustModem failed. The steps after it were done all the same."
recovery = "Close whatever is using RustModem's files or ports and run rustmodem-setup uninstall again."

[RMD9514]
severity = "info"
vars = 0
text = "Setup was cancelled, and nothing was changed."
cause = "The answer to setup's question was No."
recovery = "No action is needed."

