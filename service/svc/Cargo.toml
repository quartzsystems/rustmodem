[package]
name = "svc"
description = "The rustmodem Windows service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
config.workspace = true
ctlproto.workspace = true
ctlsrv.workspace = true
engine.workspace = true
media.workspace = true
msg.workspace = true
pipe = { workspace = true, features = ["server"] }
pool.workspace = true
serial.workspace = true
telephony.workspace = true
tokio.workspace = true
toml_edit.workspace = true

[build-dependencies]
glyph.workspace = true

[target."cfg(windows)".dependencies]
windows-service.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The far end of the tests that run calls over real sockets.
rtp.workspace = true
sdp.workspace = true
sip.workspace = true
sippeer.workspace = true

[lints]
workspace = true

[lib]
name = "svc"
path = "src/lib.rs"

[[bin]]
name = "rustmodem-svc"
path = "src/main.rs"
