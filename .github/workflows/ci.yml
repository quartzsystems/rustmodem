name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (everything)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Licence headers
        shell: bash
        run: ci/headers.sh
      - name: Version
        shell: bash
        run: ci/version.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Deny
        run: cargo deny check
      # The tests of the manager open its window against the demo service:
      # the screenshot tests, which compare each view with its golden, the
      # smoke test and the reconnect test.
      - name: Test
        run: cargo test --workspace
      # What the screenshot tests saw, and for a view that failed its
      # golden and where the two differ.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/
          if-no-files-found: warn
      - name: Release build
        run: cargo build --release -p svc -p ctl -p manager

  linux:
    name: Linux (pure crates)
    runs-on: ubuntu-latest
    env:
      PURE: -p engine -p at -p serial -p sdp -p rtp -p sip -p msg -p config -p ctlproto -p pool -p media -p telephony -p glyph -p model
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy $PURE --all-targets -- -D warnings
      - name: Test
        run: cargo test $PURE

  fuzz:
    name: Fuzz (${{ matrix.target }}, 10 minutes)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [at_input, sdp_parse, rtp_packet, sip_message]
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        run: cargo +nightly fuzz run --fuzz-dir tools/fuzz ${{ matrix.target }} -- -max_total_time=600
