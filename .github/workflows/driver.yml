# The driver's workspace and the setup program, which need a Windows
# Driver Kit and a machine to install on, and so are not among the ci
# workflow's jobs. docs/DRIVER_SPIKE.md says why this image.

name: driver

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  driver:
    name: Driver and setup (build, sign, install, conformance, uninstall)
    # This image has the kit, 10.0.26100, and an LLVM that the bindings
    # are generated with. windows-latest has no kit.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Format
        working-directory: driver
        run: cargo fmt --check
      - name: Clippy
        working-directory: driver
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # The driver's graph has bindgen and cc, which rustmodem's own may
      # not: driver/deny.toml allows them here.
      - name: Deny
        working-directory: driver
        run: cargo deny check
      # A certificate made for this run, on a machine that is thrown away
      # after it. Its private key never leaves the runner.
      - name: Lab certificate
        run: |
          New-Item -ItemType Directory C:\lab | Out-Null
          $made = ./ci/lab-certificate.ps1 -Out C:\lab\rustmodem-lab.cer -Years 1
          $thumbprint = ($made | Where-Object { $_ -match '^thumbprint:\s+(\S+)' } | ForEach-Object { $Matches[1] })
          "LAB_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
      # The programs, the driver package (with InfVerif on both INFs), the
      # catalog, everything signed, and the setup program.
      - name: Build
        run: ./ci/build.ps1 -Thumbprint $env:LAB_THUMBPRINT -LabCertificate C:\lab\rustmodem-lab.cer
      - name: Upload the setup program
        uses: actions/upload-artifact@v4
        with:
          name: setup-lab-build
          path: target/setup/rustmodem-setup.exe
      # Installs with the setup program, runs the conformance suite on a
      # port, puts a line through the service, repairs, upgrades and
      # uninstalls, and checks that nothing is left. The runner has
      # test-signing on, which a real machine has not: what that leaves
      # unproven is in docs/SIGNING.md.
      - name: Install, use and remove
        timeout-minutes: 30
        run: ./ci/install-test.ps1 -Setup target\setup\rustmodem-setup.exe
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-logs
          path: C:\setup-*.log
          if-no-files-found: ignore
