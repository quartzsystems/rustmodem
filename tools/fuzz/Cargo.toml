# The fuzz targets. They build with cargo-fuzz on a nightly toolchain, keep
# their own lockfile and are not members of the rustmodem workspace:
#
#   cargo +nightly fuzz run --fuzz-dir tools/fuzz at_input -- -max_total_time=600

[package]
name = "fuzz"
description = "The rustmodem fuzz targets"
version = "0.0.0"
edition = "2024"
license = "MIT"
authors = ["Quartz Systems"]
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
at = { path = "../../dte/at" }
sdp = { path = "../../voip/sdp" }
rtp = { path = "../../voip/rtp" }
sip = { path = "../../voip/sip" }

[[bin]]
name = "at_input"
path = "fuzz_targets/at_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtp_packet"
path = "fuzz_targets/rtp_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdp_parse"
path = "fuzz_targets/sdp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sip_message"
path = "fuzz_targets/sip_message.rs"
test = false
doc = false
bench = false

[workspace]
