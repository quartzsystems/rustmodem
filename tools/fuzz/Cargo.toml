# The fuzz targets. They build with cargo-fuzz on a nightly toolchain, keep
# their own lockfile and are not members of the rustmodem workspace:
#
#   cargo +nightly fuzz run --fuzz-dir tools/fuzz at_input -- -max_total_time=600

[package]
name = "fuzz"
description = "The rustmodem fuzz targets"
version = "0.0.0"
edition = "2024"
license = "MIT"
authors = ["Quartz Systems"]
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
at = { path = "../../dte/at" }
sdp = { path = "../../voip/sdp" }
rtp = { path = "../../voip/rtp" }
sip = { path = "../../voip/sip" }
g711 = { path = "../../dsp/g711" }
fsk = { path = "../../modem/fsk" }
v22 = { path = "../../modem/v22" }
v8 = { path = "../../modem/v8" }
v42 = { path = "../../link/v42" }
alloccount = { path = "../alloccount" }

[[bin]]
name = "at_input"
path = "fuzz_targets/at_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fsk_demod"
path = "fuzz_targets/fsk_demod.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtp_packet"
path = "fuzz_targets/rtp_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdp_parse"
path = "fuzz_targets/sdp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sip_message"
path = "fuzz_targets/sip_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v22_demod"
path = "fuzz_targets/v22_demod.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v8_decode"
path = "fuzz_targets/v8_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hdlc_deframe"
path = "fuzz_targets/hdlc_deframe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lapm_frames"
path = "fuzz_targets/lapm_frames.rs"
test = false
doc = false
bench = false

[workspace]
