[package]
name = "vcom"
description = "The RustModem virtual COM port: a UMDF 2 driver around vcomcore"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 33

[lib]
name = "rmvcom"
crate-type = ["cdylib"]

[dependencies]
vcomapi = { path = "../vcomapi" }
vcomcore = { path = "../vcomcore" }
wdk-panic = "0.5.0"
wdk-sys = "0.5.2"

[build-dependencies]
wdk-build = "0.6.0"

[lints]
workspace = true
